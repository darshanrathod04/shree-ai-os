# Shree Developer Intelligence - Application Configuration
# Phase 2 MVP - Built on Shree AI OS v1.0

spring.application.name=shree-developer-intelligence
spring.security.enabled=false

# Server runs alongside shree-ai-os on port 8081
server.port=9090

# Shree AI OS SDK Configuration
# Uses in-process SDK by default (no external LLM needed for project analysis).
# Set shree.sdk.api-key and shree.sdk.provider to connect to real LLM backends.
shree.sdk.api-key=local
shree.sdk.provider=in-memory

# Developer Intelligence - In-Memory Workspace Store
# Workspace sessions are stored in-memory. For durability, configure a database.
shree.workspace.store=in-memory

# CORS for local Next.js dev on port 3000
# In production, restrict to your domain.
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Logging
logging.level.com.shreeai.os.platform.sdk=INFO
logging.level.com.shreeai.os.platform.kernels=INFO
