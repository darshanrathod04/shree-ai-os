spring.application.name=shree-playground

server.port=7070

# Playground Application Properties
shree.ai.provider=gemini
shree.ai.chain=gemini,in-memory
shree.ai.api-key=AQ.Ab8RN6IZcD70rB2qOcFONqkW5Z6j0lv7YBRn2L8ghrVvC_mqpA
GEMINI_API_KEY=AQ.Ab8RN6IZcD70rB2qOcFONqkW5Z6j0lv7YBRn2L8ghrVvC_mqpA
SHREE_LLM_CHAIN=gemini,in-memory


# ============================================
# PHASE 1 ? PERSISTENCE CONFIGURATION (pgvector)
# ============================================

# Vector provider: switch from in-memory to pgvector.
# All shree.vector.* values can be overridden via environment variables:
#   SHREE_VECTOR_PROVIDER, SHREE_VECTOR_JDBC_URL, SHREE_VECTOR_JDBC_USER,
#   SHREE_VECTOR_JDBC_PASSWORD.
# Defaults match the docker-compose.yml postgres service.
shree.vector.provider=${SHREE_VECTOR_PROVIDER:pgvector}
shree.vector.jdbc.url=${SHREE_VECTOR_JDBC_URL:jdbc:postgresql://localhost:5432/shree}
shree.vector.jdbc.user=${SHREE_VECTOR_JDBC_USER:postgres}
shree.vector.jdbc.password=${SHREE_VECTOR_JDBC_PASSWORD:shreeai}

# Embedding provider: "onnx" (local, no API key needed) or "gemini" (requires GEMINI_API_KEY).
# Can be overridden via SHREE_EMBEDDING_PROVIDER env var.
shree.embedding.provider=${SHREE_EMBEDDING_PROVIDER:onnx}

# Embedding dimensionality ? must match your embedder.
# Can be overridden via SHREE_EMBEDDING_DIMENSIONS env var.
shree.embedding.dimensions=${SHREE_EMBEDDING_DIMENSIONS:384}