# =============================================================================
# Shree AI OS — Zero-Friction Developer Infrastructure
# =============================================================================
# Spin up a PostgreSQL 16 + pgvector instance with:
#   docker compose up -d
#
# Verify health with:
#   docker compose ps
#   docker compose exec postgres-vector pg_isready -U postgres -d shree
#
# Stop + remove with:
#   docker compose down          # data volume preserved
#   docker compose down -v       # data volume destroyed
# =============================================================================

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: shree-postgres-vector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shree}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shreeai}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shree}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data:
    name: shree-pgvector-data
