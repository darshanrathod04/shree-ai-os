# =============================================================================
# Publish Shree AI OS to Maven Central Portal (Sonatype Central)
# =============================================================================
name: Publish to Maven Central

on:
  release:
    types: [published]

concurrency:
  group: maven-central-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign, and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # ------------------------------------------------------------
      # Import GPG private key
      # ------------------------------------------------------------
      - name: Import GPG private key
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          export GNUPGHOME

          KEY_FILE="$(mktemp)"

          cat > "$KEY_FILE" <<EOF
          ${GPG_PRIVATE_KEY}
          EOF

          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --import "$KEY_FILE"

          rm "$KEY_FILE"

          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')

          echo "GNUPGHOME=$GNUPGHOME" >> $GITHUB_ENV
          echo "GPG_KEY_FPR=$FPR" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # Configure Maven settings
      # ------------------------------------------------------------
      - name: Configure Maven settings
        shell: bash
        env:
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_FPR: ${{ env.GPG_KEY_FPR }}
        run: |
          set -euo pipefail

          USERNAME="${MAVEN_CENTRAL_TOKEN%%:*}"
          PASSWORD="${MAVEN_CENTRAL_TOKEN#*:}"

          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>sonatype-nexus-staging</id>
                <username>${USERNAME}</username>
                <password>${PASSWORD}</password>
              </server>
              <server>
                <id>sonatype-nexus-snapshots</id>
                <username>${USERNAME}</username>
                <password>${PASSWORD}</password>
              </server>
            </servers>

            <profiles>
              <profile>
                <id>gpg</id>
                <properties>
                  <gpg.keyname>${GPG_KEY_FPR}</gpg.keyname>
                  <gpg.passphrase>${GPG_PASSPHRASE}</gpg.passphrase>
                  <gpg.executable>gpg</gpg.executable>
                </properties>
              </profile>
            </profiles>

            <activeProfiles>
              <activeProfile>gpg</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # ------------------------------------------------------------
      # Build + Sign + Deploy
      # ------------------------------------------------------------
      - name: Build, sign and deploy
        shell: bash
        env:
          GNUPGHOME: ${{ env.GNUPGHOME }}
        run: ./mvnw -B clean deploy

      # ------------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------------
      - name: Cleanup GPG
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ]; then
            rm -rf "$GNUPGHOME"
          fi