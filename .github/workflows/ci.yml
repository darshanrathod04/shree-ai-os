name: CI — Java 21 Runtime & Verification

on:
  push:
    branches:
      - main
      - development
      - "release/**"
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ci-java-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run deterministic test suite
        env:
          MAVEN_OPTS: "-Xmx1024m"
        run: ./mvnw -B test
