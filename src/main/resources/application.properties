spring.application.name=ai-agent
spring.security.enabled=false

server.port=8080
server.tomcat.connection-timeout=10000
server.tomcat.keep-alive-timeout=15000

# ============================================
# SHREE SYSTEM CONFIGURATION
# ============================================

# Autonomous Scheduler
# Set to false to disable autonomous background processing.
# In USER-ONLY MODE, Shree only responds to user requests.
shree.scheduler.enabled=false

# ============================================
# PHASE 1 — REAL INTELLIGENCE ENGINES (storage providers)
# All defaults preserve zero-infrastructure behavior: the platform boots
# and runs fully in-memory. Configure pgvector / neo4j for durable
# persistence. These values are read via System properties by
# VectorStoreProviders / KnowledgeGraphStores.
# ============================================

# Vector provider: in-memory | pgvector
shree.vector.provider=in-memory
# shree.vector.jdbc.url=jdbc:postgresql://localhost:5432/shree
# shree.vector.jdbc.user=shree
# shree.vector.jdbc.password=shree

# Embedding subsystem (runtime.embedding)
shree.embedding.dimensions=256

# Knowledge graph store: in-memory | neo4j
shree.knowledge.graph.provider=in-memory
# shree.neo4j.uri=bolt://localhost:7687
# shree.neo4j.user=neo4j
# shree.neo4j.password=secret

# Schema reference for self-provisioning adapters:
# src/main/resources/db/pgvector-schema.sql

# ============================================
# PHASE 2 — DISTRIBUTED STATE & MULTI-TENANCY
# L1 = cache (Redis), L2 = durable ledger (PostgreSQL).
# All defaults preserve zero-infrastructure behavior: the platform
# boots and runs fully in-memory.
# ============================================

# L1 cache provider: in-memory | redis | in-memory
# Normalized internally (case-insensitive; '-' == '_').
shree.cache.provider=in-memory
# shree.cache.redis.host=localhost
# shree.cache.redis.port=6379

# L2 persistence (PostgreSQL JDBC). Left unset = in-memory adapters.
# shree.persistence.jdbc.url=jdbc:postgresql://localhost:5432/shree
# shree.persistence.jdbc.user=shree
# shree.persistence.jdbc.password=shree